services:
  - type: web
    name: videotextget
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
    autoDeploy: true
